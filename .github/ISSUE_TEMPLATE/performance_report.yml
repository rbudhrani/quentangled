name: Performance report
description: Report a slowdown or share a reproducible performance concern.
title: "[Performance]: "
body:
  - type: markdown
    attributes:
      value: Please include enough detail to reproduce and compare the measurements.
  - type: textarea
    id: workload
    attributes:
      label: Workload
      description: Describe the circuit, gate mix, qubit count, and whether execution was sequential or parallel.
    validations:
      required: true
  - type: textarea
    id: measurements
    attributes:
      label: Measurements and comparison
      description: Include timings, a baseline if available, and how the measurements were collected.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Benchmark or reproduction steps
      description: Provide the command or minimal benchmark needed to reproduce the measurements.
      render: rust
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include CPU, operating system, Rust version, build profile, and relevant simulator settings such as chunk size or parallel threshold.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add anything else that could help explain the results, such as variance across repeated runs.