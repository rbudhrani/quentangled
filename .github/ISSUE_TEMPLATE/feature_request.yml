name: Feature request
description: Suggest a capability or API improvement.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Before submitting, please check whether the feature has already been requested.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case or limitation you encountered.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: What would you like to happen?
      description: Describe the behavior or API you have in mind. Include a short Rust example if that helps.
      render: rust
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or other approaches you considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add related documentation, examples, or context that may help evaluate the request.