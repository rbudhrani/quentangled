name: Bug report
description: Report incorrect behavior, crashes, or build failures.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Before submitting, please check whether the issue has already been reported.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior you observed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the smallest circuit, configuration, or command that demonstrates the problem.
      render: rust
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: rust-version
    attributes:
      label: Rust version
      description: For example, the output of `rustc --version`.
      placeholder: rustc 1.xx.x
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: error-output
    attributes:
      label: Error output or panic details
      description: Paste relevant output, including a backtrace if available.
      render: text